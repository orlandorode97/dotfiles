"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$golang\
$cmd_duration\
$character"""

right_format = "$time"

add_newline = true

palette = "tokyonight"

# Matches the Ghostty "TokyoNight Night" theme (bg #1a1b26 / fg #c0caf5)
[palettes.tokyonight]
text   = "#c0caf5"   # pale blue-white
accent = "#7dcfff"   # bright sky   — directory
subtle = "#bb9af7"   # purple       — branch, cmd duration
good   = "#9ece6a"   # lime         — vim cmd mode
bad    = "#ff5555"   # red          — error prompt (non-zero exit)
warn   = "#ff9e64"   # orange       — git status
info   = "#73daca"   # teal         — go version
time   = "#bb9af7"   # purple       — right-hand clock

[character]
format = "$symbol "
success_symbol = "[›](accent)"
error_symbol = "[›](bad)"
vimcmd_symbol = "[‹](good)"

[directory]
format = "[ $path ]($style)"
style = "accent"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
format = "[$branch]($style) "
style = "subtle"

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "warn"
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕ "
modified = "• "
staged = "+ "
untracked = "? "
stashed = "≡ "
conflicted = "! "
deleted = "✘ "
renamed = "» "

[golang]
format = "[$symbol$version]($style) "
symbol = "go "
style = "info"
version_format = "${raw}"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "subtle"

[time]
disabled = false
format = "[$time]($style)"
style = "time"
time_format = "%H:%M"
