"$schema" = 'https://starship.rs/config-schema.json'

# Maximalist: every segment is a colored pill (needs a Nerd Font).
# Pill = "" (round left) + content + "" (round right).
# Optional segments are wrapped in ( ) or are conditional modules, so no empty pills.

format = """
$hostname\
$directory\
$git_branch\
$golang\
$nodejs\
$python\
$rust\
$php\
$java\
$line_break\
$character"""

add_newline = true

palette = "catppuccin"

# Matches the Ghostty "Catppuccin Mocha" theme (bg #1e1e2e / fg #cdd6f4)
[palettes.catppuccin]
dark   = "#1e1e2e"   # base, text on pills
text   = "#cdd6f4"   # text
accent = "#89b4fa"   # blue
subtle = "#cba6f7"   # mauve
good   = "#a6e3a1"   # green
bad    = "#f38ba8"   # red
warn   = "#f9e2af"   # yellow
info   = "#94e2d5"   # teal
pink   = "#f5c2e7"   # pink

[character]
format = "$symbol "
success_symbol = "[❯](bold subtle)[❯](bold accent)[❯](bold info)"
error_symbol = "[❯❯❯](bold bad)"
vimcmd_symbol = "[❮❮❮](bold warn)"

[os]
disabled = false
format = "[](fg:pink)[ $symbol ](fg:dark bg:pink)[](fg:pink) "

[username]
show_always = true
format = "[](fg:info)[  $user ](fg:dark bg:info)[](fg:info) "

[hostname]
ssh_only = true
format = "[](fg:subtle)[  $hostname ](fg:dark bg:subtle)[](fg:subtle) "

[directory]
format = "[](fg:accent)[  $path$read_only ](fg:dark bg:accent)[](fg:accent) "
read_only = " "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
format = "[](fg:subtle)[  $branch ](fg:dark bg:subtle)[](fg:subtle) "

[golang]
symbol = ""
format = "[](fg:info)[ $symbol $version ](fg:dark bg:info)[](fg:info) "
version_format = "${raw}"

[nodejs]
symbol = ""
format = "[](fg:good)[ $symbol $version ](fg:dark bg:good)[](fg:good) "
version_format = "${raw}"

[python]
symbol = ""
format = "[](fg:warn)[ $symbol $version ](fg:dark bg:warn)[](fg:warn) "
version_format = "${raw}"

[rust]
symbol = ""
format = "[](fg:bad)[ $symbol $version ](fg:dark bg:bad)[](fg:bad) "
version_format = "${raw}"

[php]
symbol = ""
format = "[](fg:pink)[ $symbol $version ](fg:dark bg:pink)[](fg:pink) "
version_format = "${raw}"

[java]
symbol = ""
format = "[](fg:warn)[ $symbol $version ](fg:dark bg:warn)[](fg:warn) "
version_format = "${raw}"
