"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$golang\
$cmd_duration\
$character"""

right_format = "$time"

add_newline = true

palette = "oxocarbon"

# Matches the Ghostty "Oxocarbon" theme (bg #161616 / fg #f2f4f8)
[palettes.oxocarbon]
text   = "#f2f4f8"   # off-white
accent = "#00b4ff"   # blue         — directory
subtle = "#c693ff"   # purple       — branch, cmd duration
good   = "#00c15a"   # green        — vim cmd mode
bad    = "#ff4297"   # magenta/red  — error prompt (non-zero exit)
warn   = "#ff74b8"   # pink         — git status
info   = "#00dfdb"   # cyan         — go version
time   = "#c693ff"   # purple       — right-hand clock

[character]
format = "$symbol "
success_symbol = "[›](accent)"
error_symbol = "[›](bad)"
vimcmd_symbol = "[‹](good)"

[directory]
format = "[ $path ]($style)"
style = "accent"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
format = "[$branch]($style) "
style = "subtle"

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "warn"
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕ "
modified = "• "
staged = "+ "
untracked = "? "
stashed = "≡ "
conflicted = "! "
deleted = "✘ "
renamed = "» "

[golang]
format = "[$symbol$version]($style) "
symbol = "go "
style = "info"
version_format = "${raw}"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "subtle"

[time]
disabled = false
format = "[$time]($style)"
style = "time"
time_format = "%H:%M"
