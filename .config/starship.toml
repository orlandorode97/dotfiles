"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:subtle)\
$directory\
$git_branch\
$git_status\
[](fg:subtle)\
$cmd_duration\
$character"""

right_format = "$time"

add_newline = true

palette = "chalkboard"

[palettes.chalkboard]
accent = "#aadadb"   # chalk teal
subtle = "#6f6b74"   # muted slate grey
good   = "#aadbaa"   # chalk green
bad    = "#dbaaaa"   # chalk red
warn   = "#dadbaa"   # chalk yellow
time   = "#565261"   # dim grey

[character]
format = "$symbol "
success_symbol = "[›](accent)"
error_symbol = "[›](bad)"
vimcmd_symbol = "[‹](good)"

[directory]
format = "[ $path ]($style)"
style = "accent"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
format = "[$branch]($style) "
style = "subtle"

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "warn"
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕ "
modified = "• "
staged = "+ "
untracked = "? "
stashed = "≡ "
conflicted = "! "
deleted = "✘ "
renamed = "» "

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "subtle"

[time]
disabled = true
format = "[$time]($style)"
style = "time"
time_format = "%H:%M"
