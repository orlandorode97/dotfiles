"$schema" = 'https://starship.rs/config-schema.json'

# Minimal one-line prompt: dir, branch, go version, colored arrow.
format = "$hostname$directory$git_branch$golang$character"

add_newline = true

palette = "catppuccin"

# Matches the Ghostty "Catppuccin Mocha" theme
[palettes.catppuccin]
accent = "#b4befe"   # lavender
subtle = "#f5c2e7"   # pink
good   = "#a6e3a1"   # green
bad    = "#eba0ac"   # maroon
warn   = "#f9e2af"   # yellow
info   = "#89dceb"   # sky
pink   = "#f2cdcd"   # flamingo

[character]
format = "$symbol "
success_symbol = "[❯](good)"
error_symbol = "[❯](bad)"
vimcmd_symbol = "[❮](warn)"

[hostname]
ssh_only = true
format = "[$hostname](pink) "

[directory]
format = "[$path]($style) "
style = "accent"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
format = "[$branch](subtle) "

[golang]
symbol = ""
format = "[$version](info) "
version_format = "${raw}"
