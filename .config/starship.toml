# ── Format ─────────────────────────────────────────────────────────────────
format = """
$directory$git_branch$git_status
$character """
add_newline = true

# ── Directory ────────────────────────────────────────────────────────────────
[directory]
style             = "#c8c093"   # old white — soft, no accent
format            = "[$path]($style) "
truncation_length = 2
truncation_symbol = ""
read_only         = " 󰌾"

# ── Git Branch ─────────────────────────────────────────────────────────────
[git_branch]
symbol = ""
style  = "#727169"              # fuji gray
format = "[$branch]($style) "

# ── Git Status ─────────────────────────────────────────────────────────────
# A single dot when the tree is dirty — no per-state noise.
[git_status]
style      = "#54546d"          # dim gray dot
format     = "[$modified$staged$untracked$deleted]($style)"
modified   = "•"
staged     = "•"
untracked  = "•"
deleted    = "•"
conflicted = ""
ahead      = ""
behind     = ""
diverged   = ""
renamed    = ""

# ── Prompt Character ─────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](#727169)"  # fuji gray — quiet ok
error_symbol   = "[❯](#c34043)"  # autumn red — the only color
vimcmd_symbol  = "[❮](#727169)"  # fuji gray — vim normal
